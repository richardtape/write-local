<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Optimization Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }
    .test-section {
      margin: 30px 0;
      padding: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
    }
    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .result-box {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
    }
    .result-box h3 {
      margin-top: 0;
    }
    .result-box img {
      max-width: 100%;
      border: 1px solid #ddd;
      margin: 10px 0;
    }
    .stats {
      font-size: 14px;
      color: #666;
    }
    .stats div {
      margin: 5px 0;
    }
    button {
      padding: 10px 20px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #0052a3;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    .success {
      color: #28a745;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🖼️ Image Optimization Test</h1>
  <p>Test the Canvas API image optimization function with real images.</p>

  <div class="test-section">
    <h2>Upload and Optimize</h2>
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="testOptimization()">Optimize Image</button>

    <div class="results" id="results" style="display: none;">
      <div class="result-box">
        <h3>Original Image</h3>
        <img id="originalImage" alt="Original">
        <div class="stats">
          <div><strong>Size:</strong> <span id="originalSize"></span></div>
          <div><strong>Dimensions:</strong> <span id="originalDimensions"></span></div>
          <div><strong>Type:</strong> <span id="originalType"></span></div>
        </div>
      </div>

      <div class="result-box">
        <h3>Optimized Image (WebP)</h3>
        <img id="optimizedImage" alt="Optimized">
        <div class="stats">
          <div><strong>Size:</strong> <span id="optimizedSize"></span></div>
          <div><strong>Dimensions:</strong> <span id="optimizedDimensions"></span></div>
          <div><strong>Type:</strong> <span id="optimizedType"></span></div>
          <div class="success"><strong>Reduction:</strong> <span id="reduction"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { optimizeImage } from './src/utils/image-optimizer.js';

    window.testOptimization = async function() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert('Please select an image first');
        return;
      }

      try {
        // Show results section
        document.getElementById('results').style.display = 'grid';

        // Display original image
        const originalURL = URL.createObjectURL(file);
        const originalImg = document.getElementById('originalImage');
        originalImg.src = originalURL;

        // Get original image dimensions
        await new Promise(resolve => {
          originalImg.onload = () => {
            document.getElementById('originalDimensions').textContent =
              `${originalImg.naturalWidth} × ${originalImg.naturalHeight}px`;
            resolve();
          };
        });

        // Show original stats
        document.getElementById('originalSize').textContent =
          `${(file.size / 1024).toFixed(2)} KB`;
        document.getElementById('originalType').textContent = file.type;

        // Optimize image
        const optimizedBlob = await optimizeImage(file, {
          maxWidth: 1200,
          maxHeight: 1200,
          quality: 0.85,
          format: 'webp'
        });

        // Display optimized image
        const optimizedURL = URL.createObjectURL(optimizedBlob);
        const optimizedImg = document.getElementById('optimizedImage');
        optimizedImg.src = optimizedURL;

        // Get optimized image dimensions
        await new Promise(resolve => {
          optimizedImg.onload = () => {
            document.getElementById('optimizedDimensions').textContent =
              `${optimizedImg.naturalWidth} × ${optimizedImg.naturalHeight}px`;
            resolve();
          };
        });

        // Show optimized stats
        document.getElementById('optimizedSize').textContent =
          `${(optimizedBlob.size / 1024).toFixed(2)} KB`;
        document.getElementById('optimizedType').textContent = optimizedBlob.type;

        // Calculate reduction
        const reduction = ((1 - optimizedBlob.size / file.size) * 100).toFixed(1);
        document.getElementById('reduction').textContent = `${reduction}% smaller`;

      } catch (error) {
        alert(`Optimization failed: ${error.message}`);
        console.error(error);
      }
    };
  </script>
</body>
</html>
