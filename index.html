<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write Local</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        display: flex;
        height: 100vh;
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }

      /* Post List Sidebar */
      #post-list-sidebar {
        width: 320px;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        background: #f9f9f9;
        overflow-y: auto;
      }

      .post-list-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .post-list-header h2 {
        font-size: 1.25rem;
        color: #333;
      }

      .btn-new-post {
        background: #0066cc;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-new-post:hover {
        background: #0052a3;
      }

      .post-list-filters {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
      }

      .filter-btn {
        flex: 1;
        background: transparent;
        border: 1px solid #d0d0d0;
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        color: #666;
        transition: all 0.2s;
      }

      .filter-btn:hover {
        background: #f5f5f5;
      }

      .filter-btn.active {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
      }

      .posts-list {
        flex: 1;
        overflow-y: auto;
      }

      .trash-button-container {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        background: white;
      }

      .btn-view-trash {
        width: 100%;
        background: white;
        border: 1px solid #d0d0d0;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        color: #666;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-view-trash:hover {
        background: #f5f5f5;
        border-color: #999;
      }

      .empty-state {
        padding: 2rem;
        text-align: center;
        color: #999;
        font-size: 0.9rem;
      }

      .post-item {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e8e8e8;
        cursor: pointer;
        transition: background 0.2s;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .post-item:hover {
        background: #f5f5f5;
      }

      .post-item.active {
        background: #e3f2fd;
        border-left: 3px solid #0066cc;
        padding-left: calc(1.5rem - 3px);
      }

      .post-item-content {
        flex: 1;
        min-width: 0;
      }

      .post-item-title {
        font-weight: 500;
        color: #333;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .post-item-meta {
        display: flex;
        gap: 0.75rem;
        font-size: 0.75rem;
        color: #888;
      }

      .btn-delete-post {
        background: transparent;
        border: none;
        color: #999;
        font-size: 1.5rem;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
        line-height: 1;
        padding: 0;
      }

      .btn-delete-post:hover {
        background: #fee;
        color: #c33;
      }

      .post-item:not(:hover) .btn-delete-post {
        opacity: 0;
      }

      /* Trash View */
      .trash-view-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .trash-view-header h2 {
        flex: 1;
        font-size: 1.25rem;
        color: #333;
        margin: 0;
      }

      .trash-count {
        font-size: 0.875rem;
        color: #999;
      }

      .btn-close-trash {
        background: transparent;
        border: 1px solid #d0d0d0;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        color: #666;
        transition: all 0.2s;
      }

      .btn-close-trash:hover {
        background: #f5f5f5;
      }

      .trash-list {
        flex: 1;
        overflow-y: auto;
      }

      .trash-item {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e8e8e8;
        background: white;
      }

      .trash-item:hover {
        background: #f9f9f9;
      }

      .trash-item-content {
        width: 100%;
      }

      .trash-item-title {
        font-weight: 500;
        color: #666;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .trash-item-meta {
        font-size: 0.75rem;
        color: #999;
        margin-bottom: 0.75rem;
      }

      .trash-item-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .btn-restore,
      .btn-delete-permanent {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 500;
        transition: all 0.2s;
        border: 1px solid;
      }

      .btn-restore {
        background: white;
        color: #0066cc;
        border-color: #0066cc;
      }

      .btn-restore:hover {
        background: #0066cc;
        color: white;
      }

      .btn-delete-permanent {
        background: white;
        color: #c33;
        border-color: #c33;
      }

      .btn-delete-permanent:hover {
        background: #c33;
        color: white;
      }

      .post-status {
        padding: 0.125rem 0.5rem;
        border-radius: 3px;
        font-weight: 500;
        text-transform: capitalize;
      }

      .status-draft {
        background: #fff3cd;
        color: #856404;
      }

      .status-published {
        background: #d4edda;
        color: #155724;
      }

      .status-pending {
        background: #d1ecf1;
        color: #0c5460;
      }

      .status-trashed {
        background: #f8d7da;
        color: #721c24;
      }

      /* Editor Area */
      #editor-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      /*
       * Editor container inherits from .post-content in theme CSS.
       * Only set width to fill the editor area - all other styles come from themes.
       */
      #editor-container {
        width: 100%;
        flex: 1;
      }

      /* Post title input - uses theme CSS variables */
      #post-title {
        width: 100%;
        font-family: var(--font-family-heading, inherit);
        font-size: var(--font-size-4xl, 2.5rem);
        font-weight: 700;
        color: var(--color-text, #333);
        background-color: var(--color-background, transparent);
        border: none;
        outline: none;
        padding: 0;
        margin-bottom: var(--space-lg, 2rem);
      }

      #post-title::placeholder {
        color: var(--color-text-light, #ccc);
        opacity: 0.6;
      }

      #editorjs {
        min-height: 400px;
      }

      /* Post List Footer */
      .post-list-footer {
        padding: 1rem;
        border-top: 1px solid #e0e0e0;
        background: white;
        display: flex;
        gap: 0.5rem;
      }

      .btn-settings {
        flex: 1;
        padding: 0.75rem 1rem;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        transition: background 0.2s;
      }

      .btn-settings:hover {
        background: #f5f5f5;
      }

      /* Settings View */
      .settings-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .settings-header h2 {
        font-size: 1.25rem;
        color: #333;
        margin: 0;
      }

      .btn-back {
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        cursor: pointer;
        font-size: 0.875rem;
        transition: background 0.2s;
      }

      .btn-back:hover {
        background: #f5f5f5;
      }

      .settings-section {
        padding: 1.5rem;
        background: white;
        margin: 1rem;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
      }

      .settings-section h3 {
        margin: 0 0 1rem 0;
        font-size: 1.1rem;
        color: #333;
      }

      .settings-item {
        margin-bottom: 1.5rem;
      }

      .settings-item label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #333;
      }

      .settings-item select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
        cursor: pointer;
      }

      .settings-help {
        margin-top: 0.5rem;
        font-size: 0.8rem;
        color: #666;
      }

      .settings-item input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
      }

      .settings-item input[type="text"]:focus {
        outline: none;
        border-color: #0066cc;
      }

      .btn-primary {
        padding: 0.75rem 1.5rem;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-primary:hover {
        background: #0052a3;
      }

      .save-status {
        margin-top: 1rem;
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 0.875rem;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s;
        background: #e8f5e9;
        color: #2e7d32;
      }

      .save-status.visible {
        opacity: 1;
      }

      /* Editor Toolbar */
      .editor-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 3rem;
        border-bottom: 1px solid #e0e0e0;
        background: #fafafa;
      }

      .toolbar-buttons {
        display: flex;
        gap: 0.5rem;
      }

      /* Post Theme Selector */
      .post-theme-selector {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .post-theme-selector label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #333;
      }

      .post-theme-selector select {
        padding: 0.5rem 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .post-theme-selector select:hover:not(:disabled) {
        border-color: #0066cc;
      }

      .post-theme-selector select:focus {
        outline: none;
        border-color: #0066cc;
      }

      .post-theme-selector select:disabled {
        background: #f5f5f5;
        color: #999;
        cursor: not-allowed;
      }

      .btn-export {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: #0066cc;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-export:hover {
        background: #0052a3;
      }

      .btn-export:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .btn-export.exporting {
        background: #666;
      }

      /* Publish Button */
      .btn-publish {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-publish:hover {
        background: #059669;
      }

      /* Publish View */
      .publish-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .publish-header h2 {
        font-size: 1.25rem;
        color: #333;
        margin: 0;
      }

      .publish-content {
        padding: 1.5rem;
      }

      .publish-connect,
      .publish-options,
      .publish-progress,
      .publish-success,
      .publish-error {
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1.5rem;
      }

      .publish-connect p,
      .publish-options p {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        line-height: 1.5;
      }

      .publish-help {
        color: #888 !important;
        font-size: 0.8rem !important;
        margin-top: 1rem !important;
      }

      .btn-connect-netlify {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #00ad9f;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-connect-netlify:hover {
        background: #009688;
      }

      .netlify-connected {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #e0e0e0;
      }

      .connected-badge {
        color: #10b981;
        font-weight: 500;
        font-size: 0.9rem;
      }

      .btn-disconnect {
        background: transparent;
        border: 1px solid #ddd;
        padding: 0.4rem 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        color: #666;
        transition: all 0.2s;
      }

      .btn-disconnect:hover {
        background: #fee;
        border-color: #c33;
        color: #c33;
      }

      .site-selection {
        margin-bottom: 1.5rem;
      }

      .site-selection label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #333;
        font-size: 0.9rem;
      }

      .site-selection select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.875rem;
        background: white;
        cursor: pointer;
      }

      .publish-options .btn-publish {
        width: 100%;
        justify-content: center;
        padding: 0.75rem 1rem;
      }

      /* Publish Progress */
      .publish-progress {
        text-align: center;
        padding: 2rem 1.5rem;
      }

      .progress-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e0e0e0;
        border-top-color: #10b981;
        border-radius: 50%;
        margin: 0 auto 1rem;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .progress-status {
        color: #666;
        font-size: 0.9rem;
      }

      /* Publish Success */
      .publish-success {
        text-align: center;
        padding: 2rem 1.5rem;
      }

      .success-icon {
        width: 50px;
        height: 50px;
        background: #d1fae5;
        color: #10b981;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
      }

      .publish-success h3 {
        color: #333;
        margin-bottom: 0.5rem;
      }

      .publish-success p {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 0.75rem;
      }

      .site-url {
        display: block;
        color: #0066cc;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        word-break: break-all;
      }

      .btn-view-site {
        background: #10b981;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-view-site:hover {
        background: #059669;
      }

      /* Publish Error */
      .publish-error {
        text-align: center;
        padding: 2rem 1.5rem;
      }

      .error-icon {
        width: 50px;
        height: 50px;
        background: #fee2e2;
        color: #ef4444;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        margin: 0 auto 1rem;
      }

      .publish-error h3 {
        color: #333;
        margin-bottom: 0.5rem;
      }

      .error-message {
        color: #ef4444;
        font-size: 0.9rem;
        margin-bottom: 1rem;
        word-break: break-word;
      }

      .btn-retry {
        background: #ef4444;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-retry:hover {
        background: #dc2626;
      }

      .publish-no-post {
        padding: 2rem;
        text-align: center;
        color: #888;
      }

      .publish-loading {
        text-align: center;
        padding: 2rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Post List Sidebar -->
      <div id="post-list-sidebar"></div>

      <!-- Editor Area -->
      <div id="editor-area">
        <div class="editor-toolbar">
          <div id="post-theme-selector-container"></div>
          <div class="toolbar-buttons">
            <button class="btn-publish" id="btn-publish">
              Publish
            </button>
            <button class="btn-export" id="btn-export" disabled>
              Export ZIP
            </button>
          </div>
        </div>
        <div id="editor-container" class="post-content">
          <input
            type="text"
            id="post-title"
            placeholder="Untitled Post"
            autocomplete="off"
          />
          <div id="editorjs"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
