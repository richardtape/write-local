<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write Local</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafa;
        height: 100vh;
        overflow: hidden;
      }

      #app {
        display: flex;
        height: 100vh;
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }

      /* Post List Sidebar */
      #post-list-sidebar {
        width: 320px;
        border-right: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        background: #f9f9f9;
        overflow-y: auto;
      }

      .post-list-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .post-list-header h2 {
        font-size: 1.25rem;
        color: #333;
      }

      .btn-new-post {
        background: #0066cc;
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        transition: background 0.2s;
      }

      .btn-new-post:hover {
        background: #0052a3;
      }

      .post-list-filters {
        display: flex;
        gap: 0.5rem;
        padding: 1rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
      }

      .filter-btn {
        flex: 1;
        background: transparent;
        border: 1px solid #d0d0d0;
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        color: #666;
        transition: all 0.2s;
      }

      .filter-btn:hover {
        background: #f5f5f5;
      }

      .filter-btn.active {
        background: #0066cc;
        color: white;
        border-color: #0066cc;
      }

      .posts-list {
        flex: 1;
        overflow-y: auto;
      }

      .trash-button-container {
        padding: 1rem 1.5rem;
        border-top: 1px solid #e0e0e0;
        background: white;
      }

      .btn-view-trash {
        width: 100%;
        background: white;
        border: 1px solid #d0d0d0;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        color: #666;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-view-trash:hover {
        background: #f5f5f5;
        border-color: #999;
      }

      .empty-state {
        padding: 2rem;
        text-align: center;
        color: #999;
        font-size: 0.9rem;
      }

      .post-item {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e8e8e8;
        cursor: pointer;
        transition: background 0.2s;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .post-item:hover {
        background: #f5f5f5;
      }

      .post-item.active {
        background: #e3f2fd;
        border-left: 3px solid #0066cc;
        padding-left: calc(1.5rem - 3px);
      }

      .post-item-content {
        flex: 1;
        min-width: 0;
      }

      .post-item-title {
        font-weight: 500;
        color: #333;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .post-item-meta {
        display: flex;
        gap: 0.75rem;
        font-size: 0.75rem;
        color: #888;
      }

      .btn-delete-post {
        background: transparent;
        border: none;
        color: #999;
        font-size: 1.5rem;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
        line-height: 1;
        padding: 0;
      }

      .btn-delete-post:hover {
        background: #fee;
        color: #c33;
      }

      .post-item:not(:hover) .btn-delete-post {
        opacity: 0;
      }

      /* Trash View */
      .trash-view-header {
        padding: 1.5rem;
        border-bottom: 1px solid #e0e0e0;
        background: white;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .trash-view-header h2 {
        flex: 1;
        font-size: 1.25rem;
        color: #333;
        margin: 0;
      }

      .trash-count {
        font-size: 0.875rem;
        color: #999;
      }

      .btn-close-trash {
        background: transparent;
        border: 1px solid #d0d0d0;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.875rem;
        color: #666;
        transition: all 0.2s;
      }

      .btn-close-trash:hover {
        background: #f5f5f5;
      }

      .trash-list {
        flex: 1;
        overflow-y: auto;
      }

      .trash-item {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e8e8e8;
        background: white;
      }

      .trash-item:hover {
        background: #f9f9f9;
      }

      .trash-item-content {
        width: 100%;
      }

      .trash-item-title {
        font-weight: 500;
        color: #666;
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .trash-item-meta {
        font-size: 0.75rem;
        color: #999;
        margin-bottom: 0.75rem;
      }

      .trash-item-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .btn-restore,
      .btn-delete-permanent {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 500;
        transition: all 0.2s;
        border: 1px solid;
      }

      .btn-restore {
        background: white;
        color: #0066cc;
        border-color: #0066cc;
      }

      .btn-restore:hover {
        background: #0066cc;
        color: white;
      }

      .btn-delete-permanent {
        background: white;
        color: #c33;
        border-color: #c33;
      }

      .btn-delete-permanent:hover {
        background: #c33;
        color: white;
      }

      .post-status {
        padding: 0.125rem 0.5rem;
        border-radius: 3px;
        font-weight: 500;
        text-transform: capitalize;
      }

      .status-draft {
        background: #fff3cd;
        color: #856404;
      }

      .status-published {
        background: #d4edda;
        color: #155724;
      }

      .status-pending {
        background: #d1ecf1;
        color: #0c5460;
      }

      .status-trashed {
        background: #f8d7da;
        color: #721c24;
      }

      /* Editor Area */
      #editor-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      #editor-container {
        padding: 3rem;
        max-width: 800px;
        margin: 0 auto;
        width: 100%;
      }

      #post-title {
        width: 100%;
        font-size: 2.5rem;
        font-weight: 700;
        border: none;
        outline: none;
        padding: 0.5rem 0;
        margin-bottom: 2rem;
        font-family: inherit;
        color: #333;
        background: transparent;
      }

      #post-title::placeholder {
        color: #ccc;
      }

      #editorjs {
        min-height: 400px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Post List Sidebar -->
      <div id="post-list-sidebar"></div>

      <!-- Editor Area -->
      <div id="editor-area">
        <div id="editor-container">
          <input
            type="text"
            id="post-title"
            placeholder="Untitled Post"
            autocomplete="off"
          />
          <div id="editorjs"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
